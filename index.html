<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You — Wall of Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(220, 38, 38, 0.08), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(37, 99, 235, 0.09), transparent 30%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.08), transparent 32%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .glass-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
    }
    .accent-red { border-top: 3px solid #ef4444; }
    .accent-green { border-top: 3px solid #10b981; }
    .accent-blue { border-top: 3px solid #3b82f6; }
    .accent-red:hover { border-color: rgba(239, 68, 68, 0.5); }
    .accent-green:hover { border-color: rgba(16, 185, 129, 0.5); }
    .accent-blue:hover { border-color: rgba(59, 130, 246, 0.5); }
  </style>
</head>
<body class="antialiased selection:bg-blue-500/30">

  <!-- Header -->
  <header class="max-w-5xl mx-auto px-6 pt-12 pb-8 text-center">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs font-medium tracking-wider uppercase text-slate-300 mb-5">
      <span class="w-2 h-2 rounded-full bg-red-500"></span>
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      <span class="w-2 h-2 rounded-full bg-blue-500"></span>
      <span class="ml-1">A Space Built For You</span>
    </div>
    <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-white mb-4">
      Keep Going, <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-emerald-400 to-blue-400">You’ve Got This.</span>
    </h1>
    <p class="text-slate-400 max-w-xl mx-auto text-sm md:text-base leading-relaxed">
      Kumpulan catatan kecil dari orang-orang yang percaya sama kamu. Kapan pun hari terasa berat, buka halaman ini dan ingat kalau kamu nggak pernah jalan sendirian.
    </p>

    <!-- Action Buttons -->
    <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
      <button onclick="openModal()" class="px-5 py-2.5 rounded-lg bg-white text-slate-950 font-semibold text-sm hover:bg-slate-200 transition shadow-lg shadow-white/5 flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Tulis Pesan Baru
      </button>
      <button onclick="triggerBoost()" class="px-5 py-2.5 rounded-lg bg-slate-800/90 text-slate-200 border border-slate-700 font-medium text-sm hover:bg-slate-800 hover:border-slate-600 transition flex items-center gap-2">
        <span>⚡</span> Suntikan Semangat Acak
      </button>
    </div>

    <!-- Filter Tabs -->
    <div class="mt-8 flex flex-wrap items-center justify-center gap-2 text-xs">
      <button onclick="filterMessages('all')" id="filter-all" class="filter-btn active px-3.5 py-1.5 rounded-md bg-white/15 text-white font-medium transition">Semua Pesan</button>
      <button onclick="filterMessages('red')" id="filter-red" class="filter-btn px-3.5 py-1.5 rounded-md bg-white/5 text-slate-400 hover:text-white transition flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-red-500"></span> Energi & Semangat
      </button>
      <button onclick="filterMessages('green')" id="filter-green" class="filter-btn px-3.5 py-1.5 rounded-md bg-white/5 text-slate-400 hover:text-white transition flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Tenang & Apresiasi
      </button>
      <button onclick="filterMessages('blue')" id="filter-blue" class="filter-btn px-3.5 py-1.5 rounded-md bg-white/5 text-slate-400 hover:text-white transition flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-blue-500"></span> Fokus & Keyakinan
      </button>
    </div>
  </header>

  <!-- Boost Banner (Hidden by default) -->
  <div id="boost-banner" class="hidden max-w-2xl mx-auto px-6 mb-8">
    <div class="glass-card rounded-xl p-5 border-l-4 border-blue-500 flex items-start justify-between gap-4">
      <div>
        <p class="text-xs uppercase tracking-wider text-blue-400 font-semibold mb-1">Reminder For Today</p>
        <p id="boost-text" class="text-slate-200 text-sm md:text-base italic"></p>
      </div>
      <button onclick="document.getElementById('boost-banner').classList.add('hidden')" class="text-slate-500 hover:text-slate-300 text-sm">✕</button>
    </div>
  </div>

  <!-- Wall Grid -->
  <main class="max-w-5xl mx-auto px-6 pb-20">
    <div id="loading" class="text-center py-12 text-slate-500 text-sm">Memuat catatan penyemangat...</div>
    <div id="wall-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- Modal Form -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-semibold text-white">Kirim Catatan Penyemangat</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <form id="message-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Dari Siapa</label>
          <input type="text" id="sender" required placeholder="Nama / inisial kamu" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Nuansa Aksen Kartu</label>
          <div class="grid grid-cols-3 gap-2.5">
            <label class="cursor-pointer">
              <input type="radio" name="category" value="red" class="peer sr-only" checked>
              <div class="p-2.5 rounded-lg bg-slate-950 border border-slate-800 peer-checked:border-red-500 peer-checked:bg-red-500/10 text-center text-xs font-medium text-slate-300">
                <span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1"></span> Red
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="category" value="green" class="peer sr-only">
              <div class="p-2.5 rounded-lg bg-slate-950 border border-slate-800 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 text-center text-xs font-medium text-slate-300">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1"></span> Green
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="category" value="blue" class="peer sr-only">
              <div class="p-2.5 rounded-lg bg-slate-950 border border-slate-800 peer-checked:border-blue-500 peer-checked:bg-blue-500/10 text-center text-xs font-medium text-slate-300">
                <span class="inline-block w-2 h-2 rounded-full bg-blue-500 mr-1"></span> Blue
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Pesan Untuknya</label>
          <textarea id="content" rows="4" required placeholder="Tulis kata-kata penyemangat, apresiasi, atau doa terbaik..." class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-2.5 rounded-lg bg-white text-slate-950 font-semibold text-sm hover:bg-slate-200 transition">
          Tempel ke Wall
        </button>
      </form>
    </div>
  </div>

  <script>
    // =================================================================
    // GANTI DUA BARIS DI BAWAH INI DENGAN PROJECT URL & ANON KEY MILIKMU
    // =================================================================
    const SUPABASE_URL = 'https://ydbennrbvouvlrchpqdt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DWctMYcYbAgKk074Uys45A_umsYCPqT';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allMessages = [];
    let currentFilter = 'all';

    const defaultBoosts = [
      "Progres kecil setiap hari tetaplah sebuah kemajuan. Jangan lupa istirahat sejenak.",
      "Kamu sudah melewati banyak hari sulit sebelumnya, dan hari ini pun pasti bisa kamu taklukkan.",
      "Fokus pada apa yang bisa kamu kendalikan hari ini. Kamu jauh lebih kuat dari yang kamu kira.",
      "Terima kasih sudah berjuang sejauh ini. Bangga banget sama prosesmu!"
    ];

    async function fetchMessages() {
      const { data, error } = await db
        .from('messages')
        .select('*')
        .order('created_at', { ascending: false });

      document.getElementById('loading').classList.add('hidden');

      if (error) {
        console.error(error);
        document.getElementById('wall-grid').innerHTML = `
          <div class="col-span-full text-center text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl p-4">
            Koneksi database belum diatur atau URL/Key salah. Pastikan SUPABASE_URL dan SUPABASE_ANON_KEY sudah diisi dengan benar.
          </div>`;
        return;
      }

      allMessages = data;
      renderWall();
    }

    function renderWall() {
      const grid = document.getElementById('wall-grid');
      const filtered = currentFilter === 'all' 
        ? allMessages 
        : allMessages.filter(m => m.category === currentFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">Belum ada catatan di kategori ini. Jadilah yang pertama menulis!</div>`;
        return;
      }

      grid.innerHTML = filtered.map(msg => {
        const accentClass = msg.category === 'red' ? 'accent-red' : msg.category === 'green' ? 'accent-green' : 'accent-blue';
        const dotColor = msg.category === 'red' ? 'bg-red-500' : msg.category === 'green' ? 'bg-emerald-500' : 'bg-blue-500';
        const dateStr = new Date(msg.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

        return `
          <div class="glass-card ${accentClass} rounded-xl p-5 flex flex-col justify-between">
            <p class="text-slate-200 text-sm leading-relaxed whitespace-pre-line mb-5">"${escapeHtml(msg.content)}"</p>
            <div class="flex items-center justify-between pt-3 border-t border-white/5 text-xs">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full ${dotColor}"></span>
                <span class="font-medium text-slate-300">${escapeHtml(msg.sender)}</span>
                <span class="text-slate-600">• ${dateStr}</span>
              </div>
              <button onclick="likeMessage(${msg.id}, ${msg.likes || 0})" class="flex items-center gap-1 px-2 py-1 rounded-md bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition">
                <span>👏</span> <span>${msg.likes || 0}</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('message-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const sender = document.getElementById('sender').value.trim();
      const content = document.getElementById('content').value.trim();
      const category = document.querySelector('input[name="category"]:checked').value;

      const { error } = await db.from('messages').insert([{ sender, category, content, likes: 0 }]);

      btn.disabled = false;
      btn.textContent = 'Tempel ke Wall';

      if (!error) {
        document.getElementById('message-form').reset();
        closeModal();
        confetti({ particleCount: 45, spread: 60, origin: { y: 0.7 }, colors: ['#ef4444', '#10b981', '#3b82f6'] });
        fetchMessages();
      } else {
        alert('Gagal mengirim pesan. Cek koneksi atau pengaturan Supabase.');
      }
    });

    async function likeMessage(id, currentLikes) {
      await db.from('messages').update({ likes: currentLikes + 1 }).eq('id', id);
      fetchMessages();
    }

    function filterMessages(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-white/15', 'text-white');
        btn.classList.add('bg-white/5', 'text-slate-400');
      });
      const activeBtn = document.getElementById(`filter-${cat}`);
      activeBtn.classList.remove('bg-white/5', 'text-slate-400');
      activeBtn.classList.add('bg-white/15', 'text-white');
      renderWall();
    }

    function triggerBoost() {
      const pool = allMessages.length > 0 ? allMessages.map(m => `"${m.content}" — ${m.sender}`) : defaultBoosts;
      const randomQuote = pool[Math.floor(Math.random() * pool.length)];
      document.getElementById('boost-text').textContent = randomQuote;
      document.getElementById('boost-banner').classList.remove('hidden');
      confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 }, colors: ['#ef4444', '#10b981', '#3b82f6'] });
    }

    function openModal() { document.getElementById('modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    fetchMessages();
  </script>
</body>
</html>
